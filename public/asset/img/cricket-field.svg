<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" role="img" aria-labelledby="field-title field-description">
  <title id="field-title">Cricket field</title>
  <desc id="field-description">Top-down oval cricket ground with the boundary, inner field circle, pitch, and wickets.</desc>
  <defs>
    <linearGradient id="field-grass" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#355a3b"/>
      <stop offset=".52" stop-color="#24432e"/>
      <stop offset="1" stop-color="#182f23"/>
    </linearGradient>
    <radialGradient id="field-light" cx=".49" cy=".44" r=".72">
      <stop offset="0" stop-color="#9bc179" stop-opacity=".16"/>
      <stop offset="1" stop-color="#13251b" stop-opacity=".2"/>
    </radialGradient>
    <pattern id="field-mow-lines" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(18)">
      <path d="M0 0h9v18H0z" fill="#d8e8c8" opacity=".035"/>
    </pattern>
    <clipPath id="field-boundary">
      <ellipse cx="200" cy="110" rx="178" ry="97"/>
    </clipPath>
  </defs>
  <rect width="400" height="220" rx="18" fill="#101b15"/>
  <ellipse cx="200" cy="110" rx="178" ry="97" fill="url(#field-grass)" stroke="#bed4a8" stroke-opacity=".78" stroke-width="2"/>
  <g clip-path="url(#field-boundary)">
    <rect x="22" y="13" width="356" height="194" fill="url(#field-mow-lines)"/>
    <rect x="22" y="13" width="356" height="194" fill="url(#field-light)"/>
    <path d="M22 110h356M200 13v194" stroke="#e3efd9" stroke-opacity=".12" stroke-width="1"/>
    <ellipse cx="200" cy="110" rx="110" ry="60" fill="none" stroke="#d7e7c7" stroke-opacity=".48" stroke-width="1.25" stroke-dasharray="5 5"/>
  </g>
  <path d="M192 77h16v66h-16z" fill="#b9a36e" stroke="#e5d5a5" stroke-width="1.5"/>
  <path d="M192 110h16M200 77v66" stroke="#725f3e" stroke-opacity=".78"/>
  <path d="M189 82h22M189 87h22M189 133h22M189 138h22" stroke="#f4e7c3" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M196 78v5m8-5v5m-8 57v5m8-5v5" stroke="#fff1cd" stroke-width="1.2"/>
</svg>
